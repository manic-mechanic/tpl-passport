name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Pinned: Playwright 1.59 cannot install Chromium on Ubuntu 26.04,
    # which ubuntu-latest now resolves to.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Nuxt 4.6 requires Node ^22.22.3 || ^24.15.0. Matches the
          # Vercel project's Node 24.x setting.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx nuxi typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # E2E runs against the production build. The tests use the dev-only
      # location-check toggle, so turn dev features on at runtime.
      - name: Start app for E2E
        env:
          HOST: 127.0.0.1
          PORT: '4173'
          NUXT_PUBLIC_IS_DEV: 'true'
        run: node .output/server/index.mjs > /tmp/nuxt-server.log 2>&1 &

      - name: Wait for app
        run: |
          for i in {1..300}; do
            if curl -fsS http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Nuxt server did not become ready in time."
          cat /tmp/nuxt-server.log
          exit 1

      - name: E2E tests
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
        run: npm run test:e2e

      - name: Print Nuxt logs on E2E failure
        if: failure()
        run: cat /tmp/nuxt-server.log
